version: '3.8'

services:
  medimind-db:
    image: postgres:16
    container_name: medimind-db
    restart: always
    environment:
      POSTGRES_DB: medimind
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data_fresh:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: medimind-redis
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: medimind-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ai-engine:
    build:
      context: ./medimind-ai-engine
      dockerfile: Dockerfile
    container_name: medimind-ai-engine
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./medimind-ai-engine/.env
    depends_on:
      - qdrant

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medimind-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=medimind-db
      - DB_PORT=5432
      - DB_DATABASE=medimind
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - FASTAPI_URL=http://ai-engine:8080
      - FASTAPI_INTERNAL_SECRET=super-secret-token
    depends_on:
      - medimind-db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medimind-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_AI_ENGINE_URL=http://localhost:8080
    depends_on:
      - backend
      - ai-engine

volumes:
  pgdata:
  qdrant_storage:
